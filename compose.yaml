services:
  postgres:
    image: postgres:16-alpine
    container_name: civicflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-civicflow}
      POSTGRES_USER: ${POSTGRES_USER:-civicflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-civicflow_secret_dev_pass_2026}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-civicflow_user} -d ${POSTGRES_DB:-civicflow}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: civicflow-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-civicflow}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-civicflow_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-civicflow_secret_dev_pass_2026}
      APP_JWT_SECRET: ${JWT_SECRET:-c2VjdXJlX2RlbW9fc2VjcmV0X2tleV9mb3JfY2l2aWNmbG93X3BsYXRmb3JtXzIwMjY=}
      APP_JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
      APP_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
    ports:
      - "${SERVER_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: civicflow-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
